apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'node-exporter'
        static_configs:
          - targets:
              - '10.1.1.50:9100'
              # - '10.1.1.XX:9100'
              # - '10.1.1.XX:9100'

        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
          - source_labels: [__address__]
            target_label: vm
            regex: (.*):9100
            replacement: $1