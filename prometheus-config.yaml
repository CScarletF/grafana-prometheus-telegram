apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'node-exporter'
        static_configs:
          - targets:
            - '10.1.1.50:9100'   # VM1 (this device)
            # - '10.1.1.XX:9100' # VM2 — uncomment and set IP when ready
            # - '10.1.1.XX:9100' # VM3 — uncomment and set IP when ready
